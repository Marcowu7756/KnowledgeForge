# Taxonomy roots (纲举目张). Orthogonal to access.classification — see
# docs/audit/TAXONOMY_VS_ACCESS_V0.md. Do not derive access from path roots.
#
# Proprietary ecosystem: root + path segments + LLM topic leaf.
# Generic capture: capture.root + by_source_type + card title leaf (pipeline).

capture:
  root: ["公开媒体", "捕获"]
  by_source_type:
    youtube: YouTube
    bilibili: Bilibili
    twitter: Twitter
    file: 本地文件
    audio: 音频
    image: 图像
    search: 检索合成
    md: 本地文件
    pdf: 本地文件
    txt: 本地文件
    notes: 笔记

projects:
  setv:
    root: ["专有知识", "SETV"]
    dest_subdir: restricted/setv
    classification: restricted
    doc_globs:
      - "**/*.md"
      - "**/*.txt"
    exclude_dir_names:
      - node_modules
      - .git
      - __pycache__
      - raw
      - data
    compress_focus: |
      SETV methodology only: state / failure / transition / reconfirm / risk control.
      Extract conclusions, trigger conditions, invalidation rules — NOT raw trade logs.
  factorlib:
    root: ["专有知识", "FactorLib"]
    dest_subdir: restricted/factorlib
    classification: restricted
    doc_globs:
      - "**/*.md"
    exclude_dir_names:
      - node_modules
      - .git
      - __pycache__
      - raw
      - data
      - params
    exclude_file_names:
      - CMakeLists.txt
      - README.md
    compress_focus: |
      Factor contracts, known gaps, experiment conclusions only.
      Do NOT ingest raw parameters, undisclosed strategy code, or backtest dumps.
  asharelib:
    root: ["专有知识", "AShareLib"]
    dest_subdir: restricted/asharelib
    classification: restricted
    doc_globs:
      - "**/*.md"
      - "**/*.txt"
    exclude_dir_names:
      - node_modules
      - .git
      - __pycache__
      - raw
      - data
      - market
    compress_focus: |
      A-share constraints, observation contracts, domain boundaries.
      Do NOT ingest tick data, account info, file paths, or live quotes.
